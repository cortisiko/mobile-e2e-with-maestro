name: Download Android apk
on:
  pull_request:
    types: [labeled]
jobs:
  download-apk:
    if: contains(github.event.pull_request.labels.*.name, 'create-builds')
    runs-on: ubuntu-latest
    steps:
      - name: Download latest release apk
        id: apk
        env:
          GH_TOKEN: ${{ secrets.MAESTRO_PAT_FOR_APK_DOWNLOAD }}
          APK_REPO: Streamatico/PolymarketViewer
        run: |
          set -euo pipefail

          RELEASE=$(curl -sSfL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${APK_REPO}/releases/latest")

          TAG=$(printf '%s' "$RELEASE" | jq -r '.tag_name')

          # Match on extension, not index: the asset name carries the version
          # (e.g. polymarket-viewer-1.43-signed.apk) and asset order isn't guaranteed.
          URL=$(printf '%s' "$RELEASE" \
            | jq -r '[.assets[] | select(.name | endswith(".apk"))][0].browser_download_url // empty')

          if [ -z "$URL" ]; then
            echo "::error::No .apk asset on ${APK_REPO} ${TAG}"
            exit 1
          fi

          echo "Downloading ${URL}"
          curl -sSfL -o app-release.apk "$URL"
          unzip -l app-release.apk > /dev/null  # an apk is a zip; catches a truncated download

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-viewer-apk-${{ steps.apk.outputs.tag }}
          path: app-release.apk
          if-no-files-found: error
